name: Release

on:
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      registry: ${{ steps.release.outputs.registry }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Detect version bump
        id: release
        run: |
          set -euo pipefail

          NEW=$(jq -r .version package.json)

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run: publishing ${NEW} to the MCP registry only"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "registry=true" >> "$GITHUB_OUTPUT"
            echo "version=${NEW}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OLD=$(git show HEAD^:package.json | jq -r .version)
          MANIFEST=$(jq -r .version server.json)

          if [ "$OLD" = "$NEW" ]; then
            echo "No version bump (${OLD} -> ${NEW}), skipping publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$MANIFEST" != "$NEW" ]; then
            echo "server.json is at ${MANIFEST} but package.json is at ${NEW}; bump both"
            exit 1
          fi

          if npm view "@decodo/mcp-server@${NEW}" version >/dev/null 2>&1; then
            echo "Version ${NEW} already on npm, skipping publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Publishing new version ${NEW} (was ${OLD})"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "registry=true" >> "$GITHUB_OUTPUT"
          echo "version=${NEW}" >> "$GITHUB_OUTPUT"

  publish:
    needs: changes
    if: needs.changes.outputs.publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Publish to npm
        run: npm publish --access public

  registry:
    needs: [changes, publish]
    if: >-
      !cancelled() && needs.changes.outputs.registry == 'true' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.changes.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher

      # npm can take several minutes to serve a new version after publish
      - name: Wait for npm to serve the new version
        run: |
          for attempt in $(seq 1 80); do
            if curl -fs -o /dev/null "https://registry.npmjs.org/@decodo/mcp-server/${VERSION}"; then
              exit 0
            fi
            sleep 15
          done
          echo "npm still does not serve ${VERSION} after 20 minutes"
          exit 1

      - name: Publish to the MCP registry
        run: |
          ./mcp-publisher login github-oidc
          for attempt in 1 2 3; do
            if ./mcp-publisher publish; then
              exit 0
            fi
            sleep 30
          done
          exit 1
