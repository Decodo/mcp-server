name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      version: ${{ steps.released.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # semantic-release tags HEAD only when it published, so no tag means nothing was released
      - name: Read released version
        id: released
        run: |
          TAG=$(git tag --points-at HEAD --list 'v*' | head -n 1)
          if [ -n "$TAG" ]; then
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          fi

  registry:
    needs: release
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
      (needs.release.result == 'success' && needs.release.outputs.version != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A manual run republishes the latest release to the MCP registry only
      - name: Resolve version
        env:
          RELEASED: ${{ needs.release.outputs.version }}
        run: |
          VERSION="${RELEASED:-$(git describe --tags --abbrev=0 --match 'v*' | sed 's/^v//')}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      # server.json keeps a placeholder in git, like package.json
      - name: Stamp version into server.json
        run: |
          jq --arg v "$VERSION" '.version = $v | .packages[].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json

      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher

      # npm can take several minutes to serve a new version after publish
      - name: Wait for npm to serve the new version
        run: |
          for attempt in $(seq 1 80); do
            if curl -fs -o /dev/null "https://registry.npmjs.org/@decodo/mcp-server/${VERSION}"; then
              exit 0
            fi
            sleep 15
          done
          echo "npm still does not serve ${VERSION} after 20 minutes"
          exit 1

      - name: Publish to the MCP registry
        run: |
          ./mcp-publisher login github-oidc
          for attempt in 1 2 3; do
            if ./mcp-publisher publish; then
              exit 0
            fi
            sleep 30
          done
          exit 1
